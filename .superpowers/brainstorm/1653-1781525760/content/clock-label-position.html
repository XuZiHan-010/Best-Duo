<style>
  .q-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .q-sub   { font-size: 13px; color: #9AA4B8; margin-bottom: 24px; }
  .cards   { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .card    { flex: 1; min-width: 220px; max-width: 320px; background: #121b2c;
             border: 1.5px solid #2a3550; border-radius: 14px; padding: 20px;
             cursor: pointer; transition: border-color 0.15s; text-align: center; }
  .card:hover    { border-color: #C9A24B55; }
  .card.selected { border-color: #C9A24B; box-shadow: 0 0 0 2px rgba(201,162,75,.25); }
  .card h3       { font-size: 14px; font-weight: 700; color: #ECE6D8; margin: 12px 0 4px; }
  .card .card-sub { font-size: 12px; color: #9AA4B8; line-height: 1.6; }
</style>

<div class="q-title">S1–S6 标签放在哪里？</div>
<div class="q-sub">两种方案对比，点击选择。</div>

<div class="cards">

  <!-- 方案 A：标签在区间内 -->
  <div class="card" data-choice="inside" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <svg width="200" height="200" viewBox="-10 -10 220 220">
      <!-- 背景圆 -->
      <circle cx="100" cy="100" r="80" fill="#0c1320" stroke="#2a3550" stroke-width="1"/>
      <!-- 外刻度环 -->
      <circle cx="100" cy="100" r="76" fill="none" stroke="#C9A24B" stroke-width="1.2" opacity="0.3"/>
      <!-- 12 刻度线 -->
      <g stroke="#C9A24B" stroke-width="1" opacity="0.45">
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(0 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(30 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(60 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(90 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(120 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(150 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(180 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(210 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(240 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(270 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(300 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(330 100 100)"/>
      </g>
      <!-- 6 段分割线（从中心圆边缘到外圈） -->
      <g stroke="#C9A24B" stroke-width="1" opacity="0.4">
        <line x1="100" y1="72" x2="100" y2="24" transform="rotate(0 100 100)"/>
        <line x1="100" y1="72" x2="100" y2="24" transform="rotate(60 100 100)"/>
        <line x1="100" y1="72" x2="100" y2="24" transform="rotate(120 100 100)"/>
        <line x1="100" y1="72" x2="100" y2="24" transform="rotate(180 100 100)"/>
        <line x1="100" y1="72" x2="100" y2="24" transform="rotate(240 100 100)"/>
        <line x1="100" y1="72" x2="100" y2="24" transform="rotate(300 100 100)"/>
      </g>
      <!-- 淡色扇形背景 S1 高亮示意 -->
      <path d="M100,100 L100,24 A76,76 0 0,1 165.8,62 Z" fill="#C9A24B" opacity="0.07"/>
      <!-- 中心圆 -->
      <circle cx="100" cy="100" r="28" fill="#121b2c" stroke="#C9A24B" stroke-width="1.5" opacity="0.7"/>
      <text x="100" y="105" text-anchor="middle" font-size="15"
            fill="#C9A24B" font-weight="700" font-family="monospace">∞</text>

      <!-- 标签：在每段扇形内部中点，r=51 -->
      <!-- S1 midpoint 30°: x=100+51*sin30=125.5, y=100-51*cos30=55.8 -->
      <text x="126" y="59" text-anchor="middle" font-size="11"
            fill="#C9A24B" font-weight="700" font-family="monospace">S1</text>
      <!-- S2 midpoint 90°: x=151, y=100 -->
      <text x="151" y="104" text-anchor="middle" font-size="11"
            fill="#9AA4B8" font-weight="600" font-family="monospace">S2</text>
      <!-- S3 midpoint 150°: x=125.5, y=144.2 -->
      <text x="126" y="148" text-anchor="middle" font-size="11"
            fill="#9AA4B8" font-weight="600" font-family="monospace">S3</text>
      <!-- S4 midpoint 210°: x=74.5, y=144.2 -->
      <text x="74" y="148" text-anchor="middle" font-size="11"
            fill="#9AA4B8" font-weight="600" font-family="monospace">S4</text>
      <!-- S5 midpoint 270°: x=49, y=100 -->
      <text x="49" y="104" text-anchor="middle" font-size="11"
            fill="#9AA4B8" font-weight="600" font-family="monospace">S5</text>
      <!-- S6 midpoint 330°: x=74.5, y=55.8 -->
      <text x="74" y="59" text-anchor="middle" font-size="11"
            fill="#9AA4B8" font-weight="600" font-family="monospace">S6</text>
    </svg>
    <h3>标签在扇形内部</h3>
    <div class="card-sub">标签居于每段中央<br>不占额外空间<br>出牌后牌堆盖住区号</div>
  </div>

  <!-- 方案 B：标签在外圈 -->
  <div class="card" data-choice="outside" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <svg width="200" height="200" viewBox="-10 -10 220 220">
      <!-- 背景圆 -->
      <circle cx="100" cy="100" r="80" fill="#0c1320" stroke="#2a3550" stroke-width="1"/>
      <!-- 外刻度环 -->
      <circle cx="100" cy="100" r="76" fill="none" stroke="#C9A24B" stroke-width="1.2" opacity="0.3"/>
      <!-- 12 刻度线 -->
      <g stroke="#C9A24B" stroke-width="1" opacity="0.45">
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(0 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(30 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(60 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(90 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(120 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(150 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(180 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(210 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(240 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(270 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(300 100 100)"/>
        <line x1="100" y1="24" x2="100" y2="32" transform="rotate(330 100 100)"/>
      </g>
      <!-- 6 段分割线 -->
      <g stroke="#C9A24B" stroke-width="1" opacity="0.4">
        <line x1="100" y1="72" x2="100" y2="24" transform="rotate(0 100 100)"/>
        <line x1="100" y1="72" x2="100" y2="24" transform="rotate(60 100 100)"/>
        <line x1="100" y1="72" x2="100" y2="24" transform="rotate(120 100 100)"/>
        <line x1="100" y1="72" x2="100" y2="24" transform="rotate(180 100 100)"/>
        <line x1="100" y1="72" x2="100" y2="24" transform="rotate(240 100 100)"/>
        <line x1="100" y1="72" x2="100" y2="24" transform="rotate(300 100 100)"/>
      </g>
      <!-- 淡色扇形背景 -->
      <path d="M100,100 L100,24 A76,76 0 0,1 165.8,62 Z" fill="#C9A24B" opacity="0.07"/>
      <!-- 中心圆 -->
      <circle cx="100" cy="100" r="28" fill="#121b2c" stroke="#C9A24B" stroke-width="1.5" opacity="0.7"/>
      <text x="100" y="105" text-anchor="middle" font-size="15"
            fill="#C9A24B" font-weight="700" font-family="monospace">∞</text>

      <!-- 标签：紧贴外圈，r=88 -->
      <!-- S1 midpoint 30°: x=100+88*sin30=144, y=100-88*cos30=23.8 -->
      <text x="144" y="27" text-anchor="middle" font-size="10"
            fill="#C9A24B" font-weight="700" font-family="monospace">S1</text>
      <!-- S2 midpoint 90°: x=188, y=100 -->
      <text x="188" y="104" text-anchor="middle" font-size="10"
            fill="#9AA4B8" font-weight="600" font-family="monospace">S2</text>
      <!-- S3 midpoint 150°: x=144, y=176.2 -->
      <text x="144" y="178" text-anchor="middle" font-size="10"
            fill="#9AA4B8" font-weight="600" font-family="monospace">S3</text>
      <!-- S4 midpoint 210°: x=56, y=176.2 -->
      <text x="56" y="178" text-anchor="middle" font-size="10"
            fill="#9AA4B8" font-weight="600" font-family="monospace">S4</text>
      <!-- S5 midpoint 270°: x=12, y=100 -->
      <text x="12" y="104" text-anchor="middle" font-size="10"
            fill="#9AA4B8" font-weight="600" font-family="monospace">S5</text>
      <!-- S6 midpoint 330°: x=56, y=23.8 -->
      <text x="56" y="27" text-anchor="middle" font-size="10"
            fill="#9AA4B8" font-weight="600" font-family="monospace">S6</text>
    </svg>
    <h3>标签紧贴外圈</h3>
    <div class="card-sub">标签在钟表外侧<br>区号始终可见，不被牌遮住<br>需要略多一点空间</div>
  </div>

</div>
